[global]
; 触摸输入延迟(ms)
delay_ms = 16
; 垂直同步发送频率(Hz)
vsync_rate = 60
; 空闲分帧默认阈值(ms)：端口未单独设 idle_ms 时使用
idle_ms = 4
; 丢包率统计周期(秒)，每周期结束仅在丢包率>0时打印一行
loss_period = 10

[GOPI]
; 游戏侧串口（接收命令 / 回传触摸状态）
port = COM34
baud = 9600
; framing 仅对转发口(Light/Camera/CARD)生效；触摸口忽略此项
framing = 0
; log：1=记录该端口收发到 logs/GOPI.log，0=不记录
log = 1
idle_ms = 4

[CIPO_1P]
; 1P 触摸控制器串口
port = COM3
baud = 9600
framing = 0
log = 1
idle_ms = 4

[CIPO_2P]
; 2P 触摸控制器串口（port 留空则禁用 2P）
port = 
baud = 9600
framing = 0
log = 1
idle_ms = 4

[Light_IN]
; 灯光 外设→PC：接灯光控制板
port = COM21
baud = 115200
; framing：1=按空闲分帧整条转发，0=即时透传
framing = 1
log = 1
; idle_ms：超过该空闲(ms)即认为一帧结束
idle_ms = 4

[Light_OUT]
; 灯光 PC→游戏：接游戏灯光输出
port = COM31
baud = 115200
framing = 1
log = 1
idle_ms = 4

[Camera_IN]
; 摄像机 外设→PC：接摄像机控制板
port = COM32
baud = 9600
framing = 1
log = 1
idle_ms = 4

[Camera_OUT]
; 摄像机 PC→游戏：接游戏摄像机输出
port = COM33
baud = 9600
framing = 1
log = 1
idle_ms = 4

[CARD_IN]
; 读卡器 外设→PC：接读卡器(1P)
port = COM35
baud = 38400
framing = 1
log = 1
idle_ms = 4

[CARD_OUT]
; 读卡器 PC→游戏：接游戏读卡器侧（dummy_2p 拦截 2P 自检 / hinata 拦截 2P 读卡）
port = COM36
baud = 38400
framing = 1
log = 1
idle_ms = 4
; dummy_2p：1=软件模拟 2P 读卡器——对游戏发往 addr=0x01 的自检指令
;           (0x62/0x30/0x32/0x54/0x50)合成应答，对 0x40 轮询等其余 2P 指令忽略；
;           用于只接 1P 读卡器时让游戏自检通过。0=关闭(透明转发)
dummy_2p = 0
; hinata：1=Hinata 兼容读卡器模式——单台设备同时应答 1P(0x00)/2P(0x01)，读卡时会把
;         同一张卡也上报给 2P，导致 2P 卡在登录确认。开启后拦截读卡器对 addr=0x01 的
;         0x42(卡片检测)有卡应答、改写为无卡，使 2P 不再触发登录。仅 framing=1 生效。0=关闭
hinata = 0
